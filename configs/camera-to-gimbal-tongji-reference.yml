%YAML:1.0
---
schema_version: 1
image_width: 1440
image_height: 1080
orientation_deg: 180

camera_frame: "opencv_processed"
gimbal_frame: "x_forward_y_left_z_up"
translation_unit: "m"

rotation_camera_to_gimbal: !!opencv-matrix
   rows: 3
   cols: 3
   dt: d
   data: [ 0., 0., 1.,
          -1., 0., 0.,
           0., -1., 0. ]

translation_camera_to_gimbal: [ 0.1, 0., 0.05 ]

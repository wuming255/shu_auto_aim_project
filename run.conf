# 常用启动配置：修改后直接运行 bash run.sh。
# 相对路径以项目根目录为基准；值不要加引号，不支持行尾注释。
# 命令行选项覆盖本文件；完整说明见 docs/launcher.md。

# 输入：image / video / camera（OpenCV）/ mvs（海康 USB SDK）。
input.type=video
input.source=demo.avi
input.camera_index=0
input.loop=false
input.width=0
input.height=0
input.fps=0

# 方向均为顺时针 0/90/180/270；相机与文件独立，处理/预览/录像共用同一方向。
# 新录像自动读取 .metadata.yml，不需因相机设置而再次旋转文件。
# 当前安装的相机画面倒置，实时相机输入层旋转 180 度；检测、窗口和新录像同步生效。
# 随附 demo.avi 已按当前相机处理方向存储但没有 sidecar，只声明其 180 度方向，不重复旋转像素。
camera.rotation_deg=180
input.rotation_deg=0
input.orientation_deg=180

# 默认不启动 CDC。0 帧数上限表示运行到 EOF 或用户停止。
runtime.dry_run=false
runtime.max_frames=0

# 非开火跟随，不等待四甲旋转模型；未发射时反馈0按默认22.0 m/s解算，非零使用实测弹速。
# 如需强制固定22仍可改为22；恢复守点用 aim.follow_target=false。
aim.follow_target=false
aim.fixed_bullet_speed_m_s=referee
safety.allow_visual_fire=true
# 单根灯条50×7 mm，外缘与140 mm板宽齐平：两中心线间距140-7=133 mm。
# 只改变PnP三维物点，保持原始检测像素四点、筛选和分类参数。
pose.feature_width_m=0.133
pose.feature_height_m=0.050
# 用户确认反馈与同济参考一致：x前/y左/z上，yaw左转、pitch向下为正、roll右手。
rotation.feedback_frame_confirmed=true
rotation.mounting_tilt_rad=0.17453292519943295

# 应用默认启用 ONNX 内容分类和共享灯条消歧；本键仅在 --no-classifier 时生效。
# 旧中央亮图案检查可用 --no-center-pattern 关闭，颜色和配对几何筛选仍保留。
detector.require_center_pattern=true
# demo.avi 的候选配置：灰度阈值分离高亮灯条与蓝色光晕；暗光/纯色灯条需另行复核。
# 对照旧亮区方式：--brightness-method max_channel --brightness-threshold 150。
detector.brightness_method=grayscale
detector.brightness_threshold=160

# dry-run/live 均可显示窗口；live/相机实时刷新，仅 dry-run 图片/视频可暂停、单步、限速。
runtime.show_debug=false
runtime.start_paused=false
runtime.playback_fps=0

# 原始 BGR 录像，默认关闭；填写新 .avi 路径即可启用，不覆盖已有文件。
# 录像仅用于 dry-run。FPS 为视频播放元数据，不限制相机采集速度。
# 0 使用输入名义 FPS，不可用时回退 30；默认 MJPG 有损，FFV1 可无损保存。
runtime.record=
runtime.record_fps=0
runtime.record_codec=MJPG

# 固定输出目录；重复运行覆盖同名文件，不清理旧图像。
# debug_dir 由应用创建；若改 log/summary 目录，请先确保父目录存在。
# 设置空值可关闭对应输出，例如 runtime.debug_dir=
runtime.debug_dir=replay_debug/latest/images
runtime.debug_every=20
runtime.log=replay_debug/latest/run.csv
runtime.summary=replay_debug/latest/summary.txt

# 海康参数：空序列号且 index=-1 时仅自动选择唯一一台设备。
camera.mvs_serial=
camera.mvs_index=-1
# 空库路径使用 SDK 库搜索；非标准 SDK 根目录通过 run.sh 的 MVS_ROOT 设置。
camera.mvs_library=
camera.exposure_us=default
camera.gain=default
camera.pixel_format=default
camera.timeout_ms=1000

# 完整内参/畸变/分辨率/方向 YAML，外参为处理后相机到云台的 R/t。
# live 必须同时提供。当前外参采用同济参考轴映射和平移，仅供本轮非开火跟随联调；
# 平移 [0.1,0,0.05] m 尚未作为当前安装实测值验收，正式瞄准需替换/验证。
camera.calibration=configs/camera-calibration.yml
camera.extrinsics=configs/camera-to-gimbal-tongji-reference.yml
# 旧四参数方式仅供 dry-run，不能与 camera.calibration 同时设置。
# camera.intrinsics=fx,fy,cx,cy

# runtime.dry_run=false 或 --live 在完整内外参校验通过后启动 CDC。
transport.device=/dev/serial/by-id/usb-YueLuEmbedded_Vision_Comm_port_3855315E3439-if00
transport.transmit_period_ms=10
transport.io_timeout_ms=20
transport.reconnect_ms=100
transport.command_max_age_ms=100
